<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecruitAI — Candidate Pool Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<main class="folder">

  <header class="folder__header">
    <div class="folder__heading">
      <p class="eyebrow">Hiring Intelligence Platform</p>
      <h1>RecruitAI</h1>
      <p class="folder__sub">Upload your candidate resume pool (.zip) to begin processing.</p>
    </div>

    <div class="case-tab">
      <span class="case-tab__label">System</span>
      <span class="case-tab__value">v1.0</span>
    </div>
  </header>

  <section class="exhibit" aria-labelledby="exhibitA">
    <div class="exhibit__head">
      <div>
        <h2 id="exhibitA">Candidate Pool Upload</h2>
        <p class="exhibit__hint">A single .zip archive containing candidate resumes (.pdf format).</p>
      </div>
    </div>

    <form action="/upload-zip" method="post" enctype="multipart/form-data" class="dropform" id="upload-form">
      <label for="zip_file" class="dropzone" id="dropzone">
        <svg class="dropzone__icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 6 L24 30 M14 18 L24 6 L34 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="8" y="34" width="32" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="3"/>
        </svg>
        <span class="dropzone__text">
          <strong>Drop your .zip file here</strong>
          <span>or click to browse — supports multiple PDF resumes in one ZIP</span>
        </span>
        <span class="dropzone__filename" id="filename"></span>
      </label>
      <input
        type="file"
        name="zip_file"
        id="zip_file"
        accept=".zip"
        required
        class="visually-hidden-input"
      >
      <button type="submit" class="btn btn--pine" id="submit-btn">Upload &amp; Process Pool &rarr;</button>
    </form>
  </section>

  <!-- Submit Overlay -->
  <div class="submit-overlay" id="loading-overlay" style="display: none;">
    <div class="spinner"></div>
    <span>Extracting Resumes &amp; Building AI Index...</span>
  </div>

  <footer class="folder__footer">
    <span>RecruitAI Engine</span>
    <span>Intake Mode</span>
  </footer>

</main>

<script>
  const input = document.getElementById('zip_file');
  const filenameEl = document.getElementById('filename');
  const dropzone = document.getElementById('dropzone');
  const uploadForm = document.getElementById('upload-form');
  const loadingOverlay = document.getElementById('loading-overlay');

  input.addEventListener('change', () => {
    if (input.files && input.files.length > 0) {
      filenameEl.textContent = input.files[0].name;
      dropzone.classList.add('dropzone--filled');
    }
  });

  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add('dropzone--drag');
    })
  );

  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove('dropzone--drag');
    })
  );

  dropzone.addEventListener('drop', (e) => {
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      input.files = e.dataTransfer.files;
      filenameEl.textContent = e.dataTransfer.files[0].name;
      dropzone.classList.add('dropzone--filled');
    }
  });

  uploadForm.addEventListener('submit', () => {
    loadingOverlay.style.display = 'flex';
  });
</script>

</body>
</html>
